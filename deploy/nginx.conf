server {
  listen 80;
  server_name _;
  client_max_body_size 512m;

  # Long timeouts for large downloads; convert runs on worker so uploads stay shorter.
  proxy_read_timeout 600s;
  proxy_send_timeout 600s;
  proxy_connect_timeout 60s;

  # Docker embedded DNS — resolve upstream at request time so nginx does not
  # crash on boot with "host not found in upstream web:3000".
  resolver 127.0.0.11 valid=10s ipv6=off;

  location / {
    set $upstream_web web:3000;
    proxy_pass http://$upstream_web;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}

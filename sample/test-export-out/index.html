<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bài giảng SCORM</title>
  <link rel="stylesheet" href="player.css" />
</head>
<body>
  <div id="app">
    <header class="top">
      <div>
        <p class="brand">Scorm Pro</p>
        <h1 id="course-title">Đang tải…</h1>
      </div>
      <div class="meta">
        <span id="progress-label">0 / 0</span>
        <span id="score-label">Điểm: 0</span>
      </div>
    </header>
    <main>
      <section id="stage" class="stage"></section>
      <aside class="panel">
        <audio id="audio" controls></audio>
        <div id="quiz-box" class="quiz hidden"></div>
        <p id="feedback" class="feedback"></p>
        <div class="nav">
          <button id="btn-prev" type="button">Trước</button>
          <button id="btn-next" type="button">Tiếp</button>
        </div>
      </aside>
    </main>
  </div>
  <script src="scorm-api.js"></script>
  <script src="player.js"></script>
</body>
</html>

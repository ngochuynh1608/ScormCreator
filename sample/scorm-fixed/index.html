<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <base href="./" />
  <title>Bài giảng SCORM</title>
  <style>:root {
  --bg: #0b1520;
  --ink: #edf3f7;
  --bar: #121f2c;
  --accent: #3ddc97;
  --muted: #8aa0b2;
  --card: #0f1c28;
  --danger: #ffb4a2;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  font-family: "Segoe UI", system-ui, sans-serif;
  color: var(--ink);
  background: var(--bg);
}
#app {
  min-height: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
}
.player-shell {
  flex: 1;
  display: flex;
  flex-direction: column;
  max-width: 1200px;
  width: 100%;
  margin: 0 auto;
  padding: 12px 12px 0;
}
.stage-wrap {
  position: relative;
  flex: 1;
  min-height: 0;
  background: #000;
  border-radius: 16px 16px 0 0;
  overflow: hidden;
  aspect-ratio: 16 / 9;
  max-height: calc(100vh - 108px);
}
.stage {
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #000;
}
.stage img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  display: block;
  background: #000;
}
.stage .content-fallback {
  padding: 2rem;
  width: 100%;
  height: 100%;
  overflow: auto;
  background: var(--card);
}
.stage h2 { margin-top: 0; }
.stage p { white-space: pre-wrap; line-height: 1.5; color: #c9d8e3; }
.quiz-overlay {
  position: absolute;
  inset: auto 0 0 0;
  max-height: 55%;
  overflow: auto;
  padding: 14px 16px;
  background: rgba(10, 18, 28, 0.94);
  border-top: 1px solid rgba(255,255,255,.08);
}
.quiz-overlay.hidden { display: none; }
.quiz-overlay label {
  display: block;
  background: rgba(255,255,255,.06);
  margin: .4rem 0;
  padding: .7rem .8rem;
  border-radius: 10px;
  cursor: pointer;
}
.feedback { min-height: 1.2em; margin: .4rem 0 .2rem; color: #b7f5d6; }
.feedback.bad { color: var(--danger); }
.controls {
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: center;
  gap: 12px;
  padding: 10px 14px;
  background: var(--bar);
  border-radius: 0 0 16px 16px;
  margin-bottom: 12px;
}
.controls-left,
.controls-right {
  display: flex;
  align-items: center;
  gap: 8px;
}
.controls-center {
  display: flex;
  flex-direction: column;
  gap: 6px;
  min-width: 0;
}
.meta-row {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  font-size: 12px;
  color: var(--muted);
  font-weight: 600;
}
#course-title {
  margin: 0;
  font-size: 13px;
  color: #d7e6ef;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
audio {
  width: 100%;
  height: 36px;
}
button {
  border: 0;
  border-radius: 999px;
  padding: .65rem 1rem;
  font-weight: 700;
  cursor: pointer;
  background: var(--accent);
  color: #083024;
}
button:disabled { opacity: .45; cursor: not-allowed; }
#btn-prev {
  background: rgba(255,255,255,.12);
  color: #fff;
}
.error-box {
  color: #b42318;
  background: #fee4e2;
  padding: .75rem 1rem;
  border-radius: 12px;
  margin: 1rem;
}
@media (max-width: 720px) {
  .controls {
    grid-template-columns: 1fr;
  }
  .controls-left,
  .controls-right {
    justify-content: space-between;
  }
  .stage-wrap {
    aspect-ratio: auto;
    min-height: 220px;
    max-height: none;
    flex: 1;
  }
}
</style>
</head>
<body>
  <div id="app">
    <div class="player-shell">
      <div class="stage-wrap">
        <section id="stage" class="stage"></section>
        <div id="quiz-box" class="quiz-overlay hidden"></div>
      </div>
      <div class="controls">
        <div class="controls-left">
          <button id="btn-prev" type="button">Trước</button>
        </div>
        <div class="controls-center">
          <div class="meta-row">
            <strong id="course-title">Đang tải…</strong>
            <span>
              <span id="progress-label">0 / 0</span>
              ·
              <span id="score-label">Điểm: 0</span>
            </span>
          </div>
          <audio id="audio" controls></audio>
          <p id="feedback" class="feedback"></p>
        </div>
        <div class="controls-right">
          <button id="btn-next" type="button">Tiếp</button>
        </div>
      </div>
    </div>
  </div>
  <script src="course-data.js"></script>
  <script>/* Minimal SCORM 1.2 / 2004 wrapper */
(function (global) {
  var API = null;
  var version = null;

  function findAPI(win) {
    var attempts = 0;
    while (win && attempts < 500) {
      try {
        if (win.API_1484_11) return { api: win.API_1484_11, version: "2004" };
        if (win.API) return { api: win.API, version: "1.2" };
      } catch (e) {}
      if (win.parent && win.parent === win) break;
      try { win = win.parent; } catch (e) { break; }
      attempts++;
    }
    return null;
  }

  function init() {
    var found = null;
    try { found = findAPI(window); } catch (e) {}
    if (!found) {
      try { if (window.opener) found = findAPI(window.opener); } catch (e) {}
    }
    if (!found) return false;
    API = found.api;
    version = found.version;
    try {
      if (version === "2004") API.Initialize("");
      else API.LMSInitialize("");
    } catch (e) {
      return false;
    }
    return true;
  }

  function get(el) {
    if (!API) return "";
    try {
      return version === "2004" ? API.GetValue(el) : API.LMSGetValue(el);
    } catch (e) { return ""; }
  }

  function set(el, val) {
    if (!API) return "false";
    try {
      return version === "2004" ? API.SetValue(el, val) : API.LMSSetValue(el, val);
    } catch (e) { return "false"; }
  }

  function commit() {
    if (!API) return "false";
    try {
      return version === "2004" ? API.Commit("") : API.LMSCommit("");
    } catch (e) { return "false"; }
  }

  function finish() {
    if (!API) return "false";
    try {
      return version === "2004" ? API.Terminate("") : API.LMSFinish("");
    } catch (e) { return "false"; }
  }

  function mapStatus(status) {
    if (version === "2004") {
      if (status === "completed") return { completion: "completed", success: "passed" };
      if (status === "incomplete") return { completion: "incomplete", success: "unknown" };
      if (status === "failed") return { completion: "completed", success: "failed" };
      if (status === "passed") return { completion: "completed", success: "passed" };
    }
    return { lesson: status };
  }

  global.ScormBridge = {
    connected: false,
    version: null,
    connect: function () {
      this.connected = init();
      this.version = version;
      return this.connected;
    },
    getSuspendData: function () {
      return version === "2004" ? get("cmi.suspend_data") : get("cmi.core.lesson_location");
    },
    setSuspendData: function (data) {
      if (version === "2004") set("cmi.suspend_data", data);
      else set("cmi.core.lesson_location", data);
      commit();
    },
    setScore: function (raw, min, max) {
      if (version === "2004") {
        set("cmi.score.raw", String(raw));
        set("cmi.score.min", String(min));
        set("cmi.score.max", String(max));
        set("cmi.score.scaled", String(max ? raw / max : 0));
      } else {
        set("cmi.core.score.raw", String(raw));
        set("cmi.core.score.min", String(min));
        set("cmi.core.score.max", String(max));
      }
      commit();
    },
    setStatus: function (status) {
      var mapped = mapStatus(status);
      if (version === "2004") {
        if (mapped.completion) set("cmi.completion_status", mapped.completion);
        if (mapped.success) set("cmi.success_status", mapped.success);
      } else {
        set("cmi.core.lesson_status", mapped.lesson || status);
      }
      commit();
    },
    finish: function () { finish(); }
  };
})(window);
</script>
  <script>(function () {
  var stage = document.getElementById("stage");
  var quizBox = document.getElementById("quiz-box");
  var feedback = document.getElementById("feedback");
  var audio = document.getElementById("audio");
  var btnPrev = document.getElementById("btn-prev");
  var btnNext = document.getElementById("btn-next");
  var progressLabel = document.getElementById("progress-label");
  var scoreLabel = document.getElementById("score-label");
  var titleEl = document.getElementById("course-title");

  if (!stage || !titleEl) {
    document.body.insertAdjacentHTML(
      "afterbegin",
      '<div class="error-box">Lỗi player: thiếu phần tử HTML bắt buộc.</div>'
    );
    return;
  }

  var course = null;
  var index = 0;
  var score = 0;
  var maxScore = 0;
  var attempts = {};
  var answered = {};

  function visibleSlides() {
    return (course && course.slides) || [];
  }

  function updateChrome() {
    var slides = visibleSlides();
    progressLabel.textContent = (slides.length ? index + 1 : 0) + " / " + slides.length;
    scoreLabel.textContent = "Điểm: " + score + (maxScore ? " / " + maxScore : "");
    btnPrev.disabled = index <= 0;
    var slide = slides[index];
    var gated = !!(slide && slide.type === "quiz" && slide.gating && !answered[slide.id]);
    btnNext.disabled = index >= slides.length - 1 || gated;
  }

  function reportProgress() {
    if (!window.ScormBridge) return;
    var slides = visibleSlides();
    var ratio = slides.length ? (index + 1) / slides.length : 0;
    ScormBridge.setSuspendData(JSON.stringify({ index: index, score: score, answered: answered }));
    if (ratio >= 1) {
      var pass = !maxScore || (score / maxScore) * 100 >= (course.passScore || 70);
      ScormBridge.setScore(score, 0, maxScore || 100);
      ScormBridge.setStatus(pass ? "passed" : "failed");
    } else {
      ScormBridge.setStatus("incomplete");
      if (maxScore) ScormBridge.setScore(score, 0, maxScore);
    }
  }

  function escapeHtml(s) {
    return String(s || "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function resolveAsset(rel) {
    if (!rel) return "";
    if (/^(data:|https?:|blob:)/i.test(rel)) return rel;
    try {
      return new URL(rel.replace(/^/+/, ""), window.location.href).href;
    } catch (e) {
      return rel;
    }
  }

  function showContentSlide(slide) {
    var fallback =
      '<div class="content-fallback"><h2>' +
      escapeHtml(slide.title) +
      "</h2><p>" +
      escapeHtml(slide.bodyText || slide.narrationScript || "") +
      "</p></div>";

    if (slide.thumbnail) {
      var img = document.createElement("img");
      img.src = resolveAsset(slide.thumbnail);
      img.alt = slide.title || "";
      img.onerror = function () {
        stage.innerHTML =
          fallback +
          '<p style="color:#ffb4a2;margin-top:1rem">Không tải được ảnh slide. Hãy chắc chắn thư mục <b>thumbs/</b> nằm cạnh index.html (giải nén đủ ZIP).</p>';
      };
      stage.innerHTML = "";
      stage.appendChild(img);
    } else {
      stage.innerHTML = fallback;
    }

    if (slide.audio) {
      audio.src = resolveAsset(slide.audio);
      try {
        audio.play();
      } catch (e) {}
    }
  }

  function submitQuiz(slide) {
    attempts[slide.id] = (attempts[slide.id] || 0) + 1;
    var selected = [];
    var inputs = quizBox.querySelectorAll('input[name="q"]:checked');
    for (var i = 0; i < inputs.length; i++) selected.push(inputs[i].value);
    var correctIds = slide.options
      .filter(function (o) { return o.correct; })
      .map(function (o) { return o.id; })
      .sort()
      .join(",");
    var chosen = selected.slice().sort().join(",");
    var ok = correctIds === chosen && selected.length > 0;
    if (ok) {
      if (!answered[slide.id]) {
        score += slide.points || 1;
        answered[slide.id] = true;
      }
      feedback.textContent = slide.feedbackCorrect || "Chính xác!";
      feedback.className = "feedback";
      updateChrome();
      reportProgress();
      return;
    }
    feedback.textContent = slide.feedbackIncorrect || "Chưa đúng, hãy thử lại.";
    feedback.className = "feedback bad";
    var maxA = slide.maxAttempts || 0;
    if (maxA > 0 && attempts[slide.id] >= maxA) {
      answered[slide.id] = true;
      updateChrome();
    }
    reportProgress();
  }

  function render() {
    var slides = visibleSlides();
    var slide = slides[index];
    feedback.textContent = "";
    feedback.className = "feedback";
    quizBox.classList.add("hidden");
    quizBox.innerHTML = "";
    audio.removeAttribute("src");
    try { audio.load(); } catch (e) {}
    if (!slide) {
      stage.innerHTML = "<div class='content-fallback'><p>Không có nội dung.</p></div>";
      updateChrome();
      return;
    }

    if (slide.type === "content") {
      showContentSlide(slide);
    } else {
      stage.innerHTML =
        '<div class="content-fallback"><h2>Câu hỏi</h2><p>' +
        escapeHtml(slide.question) +
        "</p></div>";
      quizBox.classList.remove("hidden");
      var opts = (slide.options || [])
        .map(function (o) {
          var inputType =
            slide.quizType === "single" || slide.quizType === "truefalse"
              ? "radio"
              : "checkbox";
          return (
            '<label><input type="' +
            inputType +
            '" name="q" value="' +
            o.id +
            '"/> ' +
            escapeHtml(o.text) +
            "</label>"
          );
        })
        .join("");
      quizBox.innerHTML =
        '<p style="margin:0 0 .5rem;font-weight:700;">Chọn đáp án</p>' +
        opts +
        '<button id="btn-submit" type="button">Gửi đáp án</button>';
      var submitBtn = document.getElementById("btn-submit");
      if (submitBtn) {
        submitBtn.onclick = function () {
          submitQuiz(slide);
        };
      }
    }
    updateChrome();
    reportProgress();
  }

  function bootCourse(data) {
    if (!data || !data.slides || !data.slides.length) {
      titleEl.textContent = "Bài giảng trống";
      stage.innerHTML =
        "<div class='content-fallback'><p>Không có slide nào trong gói SCORM.</p></div>";
      return;
    }
    course = data;
    titleEl.textContent = data.title || "Bài giảng";
    maxScore = (data.slides || [])
      .filter(function (s) { return s.type === "quiz"; })
      .reduce(function (sum, s) { return sum + (s.points || 1); }, 0);
    if (window.ScormBridge) {
      try {
        ScormBridge.connect();
        var raw = ScormBridge.getSuspendData();
        if (raw) {
          var saved = JSON.parse(raw);
          if (typeof saved.index === "number") index = saved.index;
          if (typeof saved.score === "number") score = saved.score;
          if (saved.answered) answered = saved.answered;
        }
        ScormBridge.setStatus("incomplete");
      } catch (e) {}
    }
    render();
  }

  function showLoadError(msg) {
    titleEl.textContent = "Lỗi tải bài giảng";
    stage.innerHTML =
      "<div class='content-fallback'><p>" + escapeHtml(msg) + "</p></div>";
  }

  function loadCourse() {
    if (window.__COURSE__ && typeof window.__COURSE__ === "object") {
      bootCourse(window.__COURSE__);
      return;
    }
    if (typeof fetch === "function") {
      fetch("course.json")
        .then(function (r) {
          if (!r.ok) throw new Error("HTTP " + r.status);
          return r.json();
        })
        .then(bootCourse)
        .catch(function (err) {
          showLoadError(
            "Không tải được dữ liệu. Hãy GIẢI NÉN toàn bộ file ZIP rồi mở index.html trong thư mục đã giải nén (không mở trực tiếp trong ZIP). Chi tiết: " +
              (err && err.message ? err.message : err)
          );
        });
      return;
    }
    showLoadError(
      "Thiếu course-data.js. Hãy giải nén đầy đủ gói SCORM rồi mở lại index.html."
    );
  }

  if (btnPrev) {
    btnPrev.onclick = function () {
      if (index > 0) {
        index -= 1;
        render();
      }
    };
  }
  if (btnNext) {
    btnNext.onclick = function () {
      var slides = visibleSlides();
      if (index < slides.length - 1) {
        index += 1;
        render();
      }
    };
  }

  window.addEventListener("beforeunload", function () {
    if (window.ScormBridge) ScormBridge.finish();
  });

  loadCourse();
})();
</script>
</body>
</html>

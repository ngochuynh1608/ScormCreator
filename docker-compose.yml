services:
  # Optional legacy HTTP-only proxy: COMPOSE_PROFILES=nginx docker compose up -d
  nginx:
    image: nginx:1.27-alpine
    profiles: ["nginx"]
    ports:
      - "0.0.0.0:80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Default edge: automatic HTTPS (Let's Encrypt) when CADDY_SITE is a public domain
  caddy:
    image: caddy:2-alpine
    ports:
      - "0.0.0.0:80:80"
      - "0.0.0.0:443:443"
      - "0.0.0.0:443:443/udp"
    environment:
      CADDY_SITE: ${CADDY_SITE:-localhost}
      CADDY_EMAIL: ${CADDY_EMAIL:-}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    # Optional host access for debugging when edge proxy ports fail.
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - .env
    environment:
      DATA_DIR: /data
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgres://${POSTGRES_USER:-scorm}:${POSTGRES_PASSWORD:-scorm}@postgres:5432/${POSTGRES_DB:-scorm}
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-scorm}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_REGION: us-east-1
    volumes:
      - app_data:/data
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    mem_limit: 4g
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    env_file:
      - .env
    environment:
      DATA_DIR: /data
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgres://${POSTGRES_USER:-scorm}:${POSTGRES_PASSWORD:-scorm}@postgres:5432/${POSTGRES_DB:-scorm}
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-scorm}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_REGION: us-east-1
      CONVERT_CONCURRENCY: ${CONVERT_CONCURRENCY:-2}
      TTS_CONCURRENCY: ${TTS_CONCURRENCY:-4}
      EXPORT_CONCURRENCY: ${EXPORT_CONCURRENCY:-1}
      LIBREOFFICE_PATH: /usr/bin/soffice
    volumes:
      - app_data:/data
      - worker_scratch:/tmp
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    mem_limit: 16g
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    mem_limit: 1g
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-scorm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scorm}
      POSTGRES_DB: ${POSTGRES_DB:-scorm}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-scorm} -d ${POSTGRES_DB:-scorm}"]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 2g
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    ports:
      - "9001:9001"
    mem_limit: 2g
    restart: unless-stopped

volumes:
  app_data:
  worker_scratch:
  redis_data:
  postgres_data:
  minio_data:
  caddy_data:
  caddy_config:
